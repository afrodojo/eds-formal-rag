name: EDS Formal RAG CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install Project Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest z3-solver pandas gradio psutil requests
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Execute Formal Pytest Suite
      run: |
        pytest -v

    - name: Execute Full System Audit Harness
      run: |
        python run_audit.py

    - name: Execute Z3 SMT Logits Verifier Test
      run: |
        python solver/z3_verifier.py || true

    - name: Execute AMD SEV-SNP Enclave Attestation Test
      run: |
        python enclave/attestation_verifier.py || true

    - name: Execute Microgrid Load & Thermal Simulation Test
      run: |
        python simulation/power_curve_sim.py || true

    - name: Execute SMT Logits Operator Unit Test
      run: |
        python model/logits_operator.py || true

    - name: Execute NIST SP 800-171 Symbolic Graph Assertions Test
      run: |
        python solver/symbolic_graph.py || true
