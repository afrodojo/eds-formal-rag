name: AEGIS-MONAD Telemetry & SMT Verification CI

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: "pip"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install z3-solver pytest

    - name: Run SMT Concurrency & Latency Test Harness
      run: |
        python 01_Research_and_Code/proofs_and_smt/test_smt_concurrency.py

    - name: Execute Telemetry & Ingestion Logger
      run: |
        python 01_Research_and_Code/telemetry_logger.py

    - name: Upload Telemetry Logs as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: telemetry-metrics-artifact
        path: notebook_sources/telemetry_metrics.json
        retention-days: 14
