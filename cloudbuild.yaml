steps:
  # Step 1: Register workspaces, selectively install API dependencies, and bundle
  - name: 'node:20-alpine'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        # 1. Define workspace layout
        printf 'packages:\n  - "apps/**"\n  - "packages/**"\n  - "workers/**"\n  - "."\n' > pnpm-workspace.yaml

        # 2. Enable corepack
        corepack enable && corepack prepare pnpm@latest --activate

        # 3. Locate API directory dynamically
        API_DIR=$$(find apps/ -name "package.json" -not -path "*/node_modules/*" | xargs dirname | head -n 1)
        echo "Found API directory at: $$API_DIR"

        # 4. Install dependencies recursively ONLY for the API service (skips broken workers/collector)
        pnpm install --filter "./$$API_DIR..." --no-frozen-lockfile

        # 5. Locate index.ts and bundle into standalone server.js
        ENTRY=$$(find $$API_DIR -name "index.ts" | head -n 1)
        echo "Bundling API entrypoint: $$ENTRY"

        npx esbuild "$$ENTRY" \
          --bundle \
          --platform=node \
          --target=node20 \
          --format=cjs \
          --outfile=/workspace/server.js \
          --external:fsevents

  # Step 2: Write production Dockerfile
  - name: 'alpine'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        printf 'FROM node:20-alpine\nWORKDIR /app\nCOPY server.js ./server.js\nENV PORT=8080\nENV HOST=0.0.0.0\nENV NODE_ENV=production\nEXPOSE 8080\nCMD ["node", "server.js"]\n' > Dockerfile

  # Step 3: Containerize Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'us-east4-docker.pkg.dev/eds2026-501814/aosint-repo/api:latest', '.']

images:
  - 'us-east4-docker.pkg.dev/eds2026-501814/aosint-repo/api:latest'
